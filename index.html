<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <style>
        /* Estilos básicos para que la página se vea ordenada y presentable */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 88%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultados {
            margin-top: 25px;
            text-align: left;
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            display: none; /* Oculto hasta que se presione el botón */
        }
        .resultados p {
            font-size: 16px;
            margin: 8px 0;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Operaciones Básicas</h2>
        <form id="calcForm">
            <div class="form-group">
                <input type="number" id="numero1" placeholder="Ingresa el primer número" required>
            </div>
            <div class="form-group">
                <input type="number" id="numero2" placeholder="Ingresa el segundo número" required>
            </div>
            <!-- Botón que ejecuta la función de JavaScript -->
            <button type="button" onclick="calcularOperaciones()">Calcular Resultados</button>
        </form>

        <!-- Aquí se mostrarán los resultados -->
        <div class="resultados" id="cajaResultados">
            <p><strong>Suma:</strong> <span id="resSuma">0</span></p>
            <p><strong>Resta:</strong> <span id="resResta">0</span></p>
            <p><strong>Multiplicación:</strong> <span id="resMultiplicacion">0</span></p>
            <p><strong>División:</strong> <span id="resDivision">0</span></p>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
